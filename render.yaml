# AlefYa — free deploy on Render (web + Socket.io realtime)
# Blueprint: https://dashboard.render.com/blueprints
# Set DATABASE_URL (Neon) on both services after first create if not prompted.

services:
  - type: web
    name: alefya-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://alefya-web.onrender.com
      - key: NEXTAUTH_URL
        value: https://alefya-web.onrender.com
      - key: NEXT_PUBLIC_REALTIME_URL
        value: https://alefya-realtime.onrender.com
      - key: REALTIME_INTERNAL_URL
        value: https://alefya-realtime.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://alefya-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: alefya-realtime
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: node server/realtime.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        fromService:
          name: alefya-web
          type: web
          envVarKey: AUTH_SECRET
      - key: REALTIME_CORS_ORIGIN
        value: https://alefya-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://alefya-web.onrender.com
